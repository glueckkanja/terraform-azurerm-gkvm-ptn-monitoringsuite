version: 2

updates:
  # All GitHub Actions version bumps in one weekly PR.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Hold back freshly published versions for a week so a compromised release
    # is likely to be yanked before Dependabot proposes it here.
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
    labels:
      - dependencies
    open-pull-requests-limit: 1

  # All OpenTofu provider version bumps in one weekly PR.
  - package-ecosystem: terraform
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Hold back freshly published versions for a week so a compromised release
    # is likely to be yanked before Dependabot proposes it here.
    cooldown:
      default-days: 7
    groups:
      terraform-providers:
        patterns:
          - "*"
    labels:
      - dependencies
    open-pull-requests-limit: 1
