name: Docs

on:
  push:
    branches: [main]
    # Only regenerate docs when Terraform source files or the docs config
    # itself change. Pure documentation edits that do not touch .tf files
    # do not re-trigger this workflow.
    paths:
      - "*.tf"
      - ".terraform-docs.yml"

# Deny all by default; the docs job needs write access to push the regenerated README.
permissions:
  contents: read

jobs:
  docs:
    name: Regenerate README with terraform-docs
    runs-on: ubuntu-latest
    permissions:
      # Write access is required to push the regenerated README back to the
      # branch. All other permissions remain denied.
      contents: write
    steps:
      # Pin all actions to full commit SHAs to prevent supply-chain attacks via
      # tag mutation. Dependabot will propose PRs when new versions are released.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Check out the ref that triggered the push so the commit lands on
          # the correct branch rather than a detached HEAD.
          ref: ${{ github.ref }}

      - uses: terraform-docs/gh-actions@aeae0038ed47a547e0c0571c32271571c2c3a739 # v1.3.0
        with:
          working-dir: .
          output-file: README.md
          output-method: inject
          git-push: "true"
          # [skip ci] prevents this commit from triggering another CI run,
          # avoiding an infinite docs-regeneration loop.
          git-commit-message: "docs: update terraform-docs [skip ci]"
