name: Release

on:
  push:
    # Trigger only on semver tags: v1.2.3, v0.1.0-alpha.1, etc.
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

# Deny all by default; the release job needs write to create the GitHub release.
permissions:
  contents: read # Baseline read access; the release job widens this.

# Serialise releases per tag. Unlike CI, a release in flight must never be
# cancelled: it would leave a tag partially published.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Validate and publish GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to create the GitHub Release and upload assets.
    steps:
      # Pin all actions to full commit SHAs to prevent supply-chain attacks via
      # tag mutation. Dependabot will propose PRs when new versions are released.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history is required so the auto-generated release notes can
          # include all commits since the previous tag.
          fetch-depth: 0
          # The release is published through the GitHub API, not through git,
          # so no credentials need to stay behind in .git/config.
          persist-credentials: false

      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.12.6
          tofu_wrapper: false

      - name: Initialise providers
        run: tofu init

      # Validate before publishing. A broken module must not ship as a release.
      - name: Validate module configuration
        run: tofu validate

      # Published with the gh CLI that ships on the runner rather than a
      # third-party action, so nothing outside this repository runs on the
      # release path.
      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          args=(--generate-notes)
          # Tags containing a hyphen (e.g. v1.0.0-alpha.1, v2.3.0-beta) are
          # marked as pre-releases automatically so consumers who pin to
          # stable releases are not inadvertently pulled onto pre-release code.
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" "${args[@]}"
