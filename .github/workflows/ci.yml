name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Deny all permissions at workflow level; each job grants only what it needs.
permissions:
  contents: read

# Cancel any in-progress run for the same ref so a fast-follow push does not
# queue behind a run it will supersede.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # A single shared plugin cache dir reduces provider download time across jobs.
  # Each job still seeds/restores its own cache entry keyed on the lock file(s)
  # it actually uses.
  TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform.d/plugin-cache

jobs:
  format:
    name: Verify OpenTofu formatting
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Pin all actions to full commit SHAs to prevent supply-chain attacks via
      # tag mutation. Dependabot will propose PRs when new versions are released.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: opentofu/setup-opentofu@fc711fa910b93cba0f3fbecaafc9f42fd0c411cb # v2.0.0
        with:
          tofu_version: 1.9.0
          # Disable the wrapper so exit codes from tofu are passed through
          # directly; the wrapper can swallow non-zero exits in some versions.
          tofu_wrapper: false

      # TF_PLUGIN_CACHE_DIR is set at workflow level; tofu validates it exists
      # even for fmt. Create it so the check does not abort before formatting.
      - run: mkdir -p "$TF_PLUGIN_CACHE_DIR"

      - name: Check formatting
        run: tofu fmt -check -recursive

  validate:
    name: Initialise and validate module configuration
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: opentofu/setup-opentofu@fc711fa910b93cba0f3fbecaafc9f42fd0c411cb # v2.0.0
        with:
          tofu_version: 1.9.0
          tofu_wrapper: false

      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          # Key on terraform.tf — this project gitignores .terraform.lock.hcl,
          # so the provider requirements file is the correct cache-bust input.
          key: ${{ runner.os }}-tofu-${{ hashFiles('terraform.tf') }}

      - name: Create plugin cache directory
        run: mkdir -p "$TF_PLUGIN_CACHE_DIR"

      - name: Initialise providers
        run: tofu init

      - name: Validate module configuration
        run: tofu validate

  test:
    name: Run unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: opentofu/setup-opentofu@fc711fa910b93cba0f3fbecaafc9f42fd0c411cb # v2.0.0
        with:
          tofu_version: 1.9.0
          tofu_wrapper: false

      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          # Both provider requirement files contribute to the cache key. This
          # project gitignores .terraform.lock.hcl, so we key on the .tf files
          # that declare provider versions instead.
          key: ${{ runner.os }}-tofu-${{ hashFiles('terraform.tf', 'tests/unit/setup/main.tf') }}

      - name: Create plugin cache directory
        run: mkdir -p "$TF_PLUGIN_CACHE_DIR"

      # -test-directory tells tofu init to also process test files in tests/unit/
      # so it registers the ./tests/unit/setup module reference. Without this
      # flag init only scans tests/ one level deep, misses tests/unit/, and
      # tofu test fails with "Module not installed".
      - name: Initialise providers and test modules
        run: tofu init -test-directory=tests/unit

      - name: Run unit tests
        run: tofu test --test-directory=tests/unit

  security:
    name: Static analysis (Checkov)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required to upload SARIF results to GitHub Code Scanning.
      security-events: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # soft_fail: true — Checkov findings are surfaced in the Code Scanning UI
      # but do not block the CI run. The SARIF upload on the next step is what
      # makes findings actionable; a hard fail here would hide the report when
      # Checkov exits non-zero before the upload step runs.
      - uses: bridgecrewio/checkov-action@3203f966a7ccd680cd8f6aaa3c3c5b0b3e9afa32 # v12.3099.0
        with:
          framework: terraform
          soft_fail: true
          output_format: cli,sarif
          output_file_path: console,results.sarif

      - uses: github/codeql-action/upload-sarif@ff0a06e83cb2de871e5a09832bc6a81e7276941f # v3.28.18
        # Run on success or failure so SARIF is uploaded even when Checkov found
        # violations, but skip on cancellation to avoid uploading partial results.
        # continue-on-error: org-level restrictions may deny security-events API
        # access; findings still appear in the console log above.
        if: success() || failure()
        continue-on-error: true
        with:
          sarif_file: results.sarif
          category: checkov

  tflint:
    name: Lint with TFLint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: terraform-linters/setup-tflint@b480b8fcdaa6f2c577f8e4fa799e89e756bb7c93 # v6.2.2
        with:
          tflint_version: v0.55.1

      - name: Init TFLint
        # GITHUB_TOKEN is passed here only so tflint --init can pull ruleset
        # plugins from GitHub without hitting the unauthenticated rate limit.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: tflint --init

      # Run against the module root only — not recursive. Descending into the
      # tests/ tree produces false positives because test files use mock
      # providers and intentionally incomplete configurations.
      - name: Run TFLint
        run: tflint

  # ---------------------------------------------------------------------------
  # docs — auto-regenerate README on PRs so contributors never need terraform-docs
  # locally. On direct pushes to main the step is a no-op (nothing to push back).
  # Fork PRs are skipped: GITHUB_TOKEN cannot push to forks.
  # ---------------------------------------------------------------------------
  docs:
    name: Regenerate docs
    runs-on: ubuntu-latest
    # Write access required to push the regenerated README back to the PR branch.
    permissions:
      contents: write
    # Skip on forks — GITHUB_TOKEN has no push rights to the contributor's fork.
    if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'push'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Check out the actual PR branch so the commit lands on the right ref.
          # For pushes to main this is a no-op (HEAD is already correct).
          ref: ${{ github.head_ref || github.ref }}

      - uses: terraform-docs/gh-actions@6de6da0cefcc6b4b7a5cbea4d79d97060733093c # v1.4.1
        with:
          working-dir: .
          output-file: README.md
          output-method: inject
          # Auto-commit the updated README to the PR branch. Contributors do not
          # need terraform-docs installed — CI handles it for them.
          git-push: ${{ github.event_name == 'pull_request' && 'true' || 'false' }}
          # On push-to-main events there is nothing to push back, so surface any
          # remaining diff as a failure instead of silently succeeding.
          fail-on-diff: ${{ github.event_name == 'push' && 'true' || 'false' }}
